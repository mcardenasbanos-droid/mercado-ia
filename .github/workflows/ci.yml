name: CI
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Instalar dependencias (sin TensorFlow, las pruebas no lo necesitan)"
        run: pip install pandas numpy requests yfinance plotly openpyxl pytest
      - name: "Compilar todos los modulos"
        run: python -m compileall -q .
      - name: "Pruebas"
        run: python -m pytest tests -q
