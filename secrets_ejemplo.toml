# PLANTILLA — Copia este archivo a .streamlit/secrets.toml y pega tus datos entre las comillas.
# ⚠️ NUNCA subas .streamlit/secrets.toml a GitHub ni lo compartas (ni en capturas).

[mexc]
api_key = "PEGA_AQUI_TU_ACCESS_KEY"
secret_key = "PEGA_AQUI_TU_SECRET_KEY"

[polymarket]
# Llave privada de una billetera SOLO para este bot, con poco USDC. Controla todo el dinero de esa billetera.
private_key = "PEGA_AQUI_TU_LLAVE_PRIVADA"
# Tercera llave del modo real: cámbialo a "1" solo cuando quieras permitir apuestas reales.
modo_real = "0"

[whatsapp]
# Avisos al celular. Recomendado: Telegram (ver README → Avisos al celular).
proveedor = "telegram"
token = "123456789:TU_TOKEN_DE_BOTFATHER"
activo = "1"
# Otras opciones:
#   proveedor = "ntfy"      + tema = "un-nombre-dificil-1234"
#   proveedor = "callmebot" + telefono = "+5215512345678" + apikey = "1234567"
#   proveedor = "twilio"    + telefono + twilio_sid = "AC..." + twilio_token = "..."
